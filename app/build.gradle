plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// Versión: una sola fuente. versionName sale de estos tres números y versionCode se deriva
// (mayor*10000 + menor*100 + parche), así siempre crece y Android acepta la actualización.
// Parche: correcciones. Menor: funciones nuevas. Mayor: cambios que rompen algo.
//
// Historia: v3.02 (base, 2026-07-19), v4 (merge con motor GOOSE propio), 5.0 (identidad de
// marca, 2026-08-23; hasta acá el número estaba escrito a mano en el Acerca de y build.gradle
// decía 1.0), 5.1.0 (2026-10-31), 5.1.1 (2026-10-31: puerto por defecto 10102),
// 5.2.0 (2026-11-01: LOCAL es el nivel de mando bahia, orCat=1),
// 5.3.0 (2026-11-03: LOCAL = bloqueo total; BAHIA = solo orCat 1),
// 5.4.0 (2026-11-03: LastApplError con AddCause y CommandTermination),
// 5.5.0 (2026-11-04: respuesta del aparato, sincronismo y terminacion diferida),
// 5.5.1 (2026-11-09: detener con clientes conectados ya no cierra la app; sin backup automatico).
// ---------------------------------------------------------------------------
def versionApp = [mayor: 5, menor: 7, parche: 0]

// Commit con el que se compila, para el Acerca de. "+cambios" si había archivos versionados
// modificados sin commitear (los no versionados no cuentan).
def commitApp = {
    try {
        def corre = { List args ->
            def p = (['git'] + args).execute(null, rootDir)
            def salida = new StringBuilder(); def error = new StringBuilder()
            p.waitForProcessOutput(salida, error)
            return p.exitValue() == 0 ? salida.toString().trim() : null
        }
        def hash = corre(['rev-parse', '--short', 'HEAD'])
        if (hash == null) return 'sin-git'
        def cambios = corre(['status', '--porcelain', '--untracked-files=no'])
        return cambios ? hash + '+cambios' : hash
    } catch (Exception ignored) {
        return 'sin-git'
    }
}

android {
    namespace 'com.ied.simulator'
    compileSdk 34

    defaultConfig {
        applicationId "com.ied.simulator"
        minSdk 24
        targetSdk 34
        versionCode versionApp.mayor * 10000 + versionApp.menor * 100 + versionApp.parche
        versionName "${versionApp.mayor}.${versionApp.menor}.${versionApp.parche}"
        buildConfigField "String", "COMMIT", "\"${commitApp()}\""
    }

    buildFeatures {
        buildConfig true
    }

    // El APK lleva la versión en el nombre: IEDsimulatorPRO_v5.1.0.apk (release) o
    // IEDsimulatorPRO_v5.1.0-debug.apk.
    applicationVariants.all { variant ->
        variant.outputs.all {
            def sufijo = variant.buildType.name == 'release' ? '' : "-${variant.buildType.name}"
            outputFileName = "IEDsimulatorPRO_v${variant.versionName}${sufijo}.apk"
        }
    }

    // Firma de release con la llave permanente (desde 5.5.1). La llave y su contraseña viven
    // FUERA del repositorio, en ~/.iedsimulator/firma.properties. Si el archivo no está,
    // el release sale sin firmar,
    // como antes: el proyecto compila igual en otra PC.
    def firmaProps = new Properties()
    def firmaArchivo = new File(System.getProperty('user.home'), '.iedsimulator/firma.properties')
    if (firmaArchivo.exists()) {
        firmaArchivo.withInputStream { firmaProps.load(it) }
    }
    signingConfigs {
        if (firmaArchivo.exists()) {
            permanente {
                storeFile file(firmaProps['storeFile'])
                storePassword firmaProps['storePassword']
                keyAlias firmaProps['keyAlias']
                keyPassword firmaProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (firmaArchivo.exists()) {
                signingConfig signingConfigs.permanente
            }
            // El build release corre con debuggable=false, y eso solo ya da ~24%
            // en el parseo de un SCL: medido con MICOM_P143 (879 KB) en el
            // emulador, SclParser baja de 10 447 ms a 7 987 ms. El build debug
            // obliga a ART a mantener todos los metodos des-optimizables.
            //
            // minifyEnabled sigue en false a proposito: SclFileParser re-vincula
            // Rcb.dataSet por REFLEXION, y si R8 renombra ese campo la fusion de
            // AccessPoints se rompe SIN error visible. Las reglas para cubrirlo
            // ya estan escritas en proguard-rules.pro; antes de activarlo hay que
            // probar con un archivo con varios AccessPoint (un SCD o una merging unit)
            // y confirmar que el re-vinculado sigue funcionando.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt']
        }
    }
}

// ---------------------------------------------------------------------------
// iec61850bean 1.9.0 con ServerAssociation y SclParser reemplazadas.
//
// La clase original rechaza por si misma los mandos con ctlModel 3 y 4 y toda
// escritura a SBOw/SBO/Cancel, ANTES de avisarle al ServerEventListener. Con
// eso el simulador no puede ejercitar el SBO de seguridad reforzada, que es el
// modelo que usan los interruptores reales del corpus.
//
// Se saca esa clase del .jar y se compila en su lugar la copia parcheada que
// vive en app/src/main/java/com/beanit/iec61850bean/. Sin la exclusion habria
// clase duplicada y el build falla. La libreria es Apache 2.0, que permite la
// modificacion; ver PARCHES-LIBRERIA.md.
//
// SclParser (2026-10-21): los arreglos de atributos tomaban todos el valor del
// primer elemento, porque ignoraba el atributo ix. Mismo mecanismo.
// ---------------------------------------------------------------------------
configurations {
    iec61850Original { transitive = false }
}

def iec61850Parcheado = tasks.register('iec61850SinServerAssociation', Jar) {
    archiveFileName = 'iec61850bean-1.9.0-parcheado.jar'
    destinationDirectory = layout.buildDirectory.dir('libs-parcheadas')
    from(zipTree(configurations.iec61850Original.singleFile)) {
        exclude 'com/beanit/iec61850bean/ServerAssociation.class'
        exclude 'com/beanit/iec61850bean/ServerAssociation$*.class'
        exclude 'com/beanit/iec61850bean/SclParser.class'
        exclude 'com/beanit/iec61850bean/SclParser$*.class'
    }
    // Se rearma SIEMPRE. Gradle no detecta un cambio en los exclude de arriba como cambio de
    // entradas: al agregar SclParser (2026-10-21) la tarea siguio "UP-TO-DATE" y el jar del
    // 2026-08-27 seguia trayendo el SclParser original. El APK llevaba las dos copias y en el
    // equipo ganaba la ORIGINAL (classes.dex): ni el parche de ix ni el de SG/SE llegaban a
    // la tablet, aunque el banco —que arma su propio classpath— pasaba. Son 600 KB.
    outputs.upToDateWhen { false }
    // Y se verifica: si una clase reemplazada quedara en el jar, el build falla aca.
    doLast {
        def reemplazadas = ['ServerAssociation', 'SclParser']
        def colados = []
        zipTree(archiveFile.get().asFile).visit { f ->
            def p = f.path
            if (reemplazadas.any { p == 'com/beanit/iec61850bean/' + it + '.class' ||
                                   p.startsWith('com/beanit/iec61850bean/' + it + '$') }) colados << p
        }
        if (!colados.isEmpty()) {
            throw new GradleException("El jar parcheado trae clases que deberian estar excluidas: " + colados)
        }
    }
}

dependencies {
    // IEC 61850 Library (ver el bloque de arriba)
    iec61850Original 'com.beanit:iec61850bean:1.9.0'
    implementation files(iec61850Parcheado)
    // transitivas de iec61850bean, que ya no llegan solas al excluir la resolucion
    implementation 'com.beanit:asn1bean:1.12.0'
    implementation 'org.slf4j:slf4j-api:1.7.25'

    // Android
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // File picker
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Room Database (for model caching)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
